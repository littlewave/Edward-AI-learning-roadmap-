<meta name="description" content="A personal 80/20 roadmap from LLM fundamentals to shipping agentic systems into real work processes.">

<style>
/* ============================================================
   TOKENS — light is the base; dark is redefined twice so that
   OS preference and the explicit toggle both resolve correctly.
   ============================================================ */
:root{
  --ground:#E7EAEF;
  --panel:#FFFFFF;
  --sunken:#F1F3F7;
  --grid:#D6DCE5;
  --rule:#D2D8E1;
  --rule-strong:#B4BDCB;
  --ink:#131920;
  --ink-2:#46525F;
  --ink-3:#6B7887;
  --accent:#1B4CA8;
  --accent-2:#3B72D6;
  --accent-soft:#E2EAF8;
  --signal:#B8401A;
  --signal-soft:#FBE7DF;
  --good:#1B6B48;
  --good-soft:#DFF0E7;
  --warn:#87590A;
  --warn-soft:#F8EBD5;
  --node-empty:#CDD5E0;
  --shadow:0 1px 2px rgba(19,25,32,.06), 0 8px 24px -16px rgba(19,25,32,.22);

  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --r:3px;
  --pad:clamp(18px,3vw,34px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1421;
    --panel:#101B2C;
    --sunken:#0A1220;
    --grid:#16253B;
    --rule:#1F3350;
    --rule-strong:#2E4A70;
    --ink:#DCE7F5;
    --ink-2:#9FB4D0;
    --ink-3:#7089AB;
    --accent:#6FA8EE;
    --accent-2:#8FC0F8;
    --accent-soft:#16263F;
    --signal:#F0794E;
    --signal-soft:#2E1A13;
    --good:#4FBF8B;
    --good-soft:#0F2A20;
    --warn:#D9A441;
    --warn-soft:#2B2211;
    --node-empty:#25395A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1421;
  --panel:#101B2C;
  --sunken:#0A1220;
  --grid:#16253B;
  --rule:#1F3350;
  --rule-strong:#2E4A70;
  --ink:#DCE7F5;
  --ink-2:#9FB4D0;
  --ink-3:#7089AB;
  --accent:#6FA8EE;
  --accent-2:#8FC0F8;
  --accent-soft:#16263F;
  --signal:#F0794E;
  --signal-soft:#2E1A13;
  --good:#4FBF8B;
  --good-soft:#0F2A20;
  --warn:#D9A441;
  --warn-soft:#2B2211;
  --node-empty:#25395A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

/* ============================================================ BASE */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.6;
  background:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 30px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 30px);
}
h1,h2,h3,h4{font-family:var(--mono);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
a{color:var(--accent);text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent);text-underline-offset:2px}
a:hover{text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ============================================================ SHELL */
.app{position:relative;z-index:1;display:grid;grid-template-columns:302px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--rule);
  background:var(--panel);
  padding:18px 0 24px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{padding:var(--pad) var(--pad) 90px;max-width:940px}

/* ---- rail head */
.brand{padding:0 22px 14px;border-bottom:1px solid var(--rule);margin-bottom:2px}
.brand h1{font-size:15px;letter-spacing:-.01em}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.brand-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.icon-btn{
  background:transparent;border:1px solid var(--rule);border-radius:var(--r);
  width:28px;height:28px;display:grid;place-items:center;color:var(--ink-3);flex:none;
}
.icon-btn:hover{border-color:var(--rule-strong);color:var(--ink)}

/* ---- spine */
.spine{list-style:none;margin:0;padding:8px 0 0}
.spine li{position:relative}
.spine-link{
  display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;align-items:start;
  width:100%;text-align:left;background:transparent;border:0;
  padding:7px 22px;text-decoration:none;color:inherit;position:relative;
}
.spine-link:hover{background:var(--sunken)}
.spine-link[aria-current="page"]{background:var(--accent-soft)}
.spine-link[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
}
/* the connecting route line */
.spine li:not(:last-child) .spine-link::after{
  content:"";position:absolute;left:calc(22px + 8px);top:24px;bottom:-7px;width:2px;
  background:var(--node-empty);
}
.node{
  width:18px;height:18px;border-radius:50%;flex:none;margin-top:3px;position:relative;z-index:1;
  background:conic-gradient(var(--accent) calc(var(--p,0) * 360deg), var(--node-empty) 0);
  transition:background .35s ease;
}
.node::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--panel)}
.spine-link[aria-current="page"] .node::after{background:var(--accent-soft)}
.node.is-next{box-shadow:0 0 0 3px var(--signal-soft), 0 0 0 4px var(--signal)}
.node.is-done{background:var(--good)}
.node.is-done::after{
  inset:0;background:none;
  /* checkmark */
  border:0;
}
.spine-t{min-width:0}
.spine-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.spine-code{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine-name{font-size:13px;line-height:1.3;display:block;margin-top:1px}
.spine-pct{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.rail-foot{padding:14px 22px 0;margin-top:14px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px}

/* ============================================================ CARDS */
.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);
}
.stack{display:flex;flex-direction:column;gap:18px}
.card-pad{padding:20px 22px}
.card-h{
  display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;
  padding:13px 22px;border-bottom:1px solid var(--rule);
}
.card-h h3{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* ---- hero / dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center;padding:26px 22px}
.hero-figure{text-align:right}
.hero-num{font-family:var(--mono);font-size:clamp(52px,9vw,76px);line-height:.92;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;display:block}
.hero-num sup{font-size:.32em;font-weight:500;vertical-align:super;color:var(--ink-3);margin-left:2px}
.hero h2{font-size:20px;margin-bottom:8px}
.hero p{color:var(--ink-2);font-size:14px;max-width:52ch}

.meter{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--rule)}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s ease}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--rule)}
.tile{background:var(--panel);padding:16px 18px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;display:block}

/* ---- next-action card: the single bold spend */
.next{border-left:3px solid var(--signal)}
.next .eyebrow{color:var(--signal)}
.next h3{font-size:17px;margin:7px 0 6px}
.next p{color:var(--ink-2);font-size:14px;max-width:60ch}

/* ---- module rows on dashboard */
.rows{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:34px minmax(0,1fr) 152px 52px;gap:14px;align-items:center;
  padding:12px 22px;border-top:1px solid var(--rule);background:transparent;border-left:0;border-right:0;border-bottom:0;
  width:100%;text-align:left;text-decoration:none;color:inherit;
}
.row:first-child{border-top:0}
.row:hover{background:var(--sunken)}
.row-code{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row-name{font-size:14px;line-height:1.35}
.row-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px;display:block}
.row-pct{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---- chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-3);white-space:nowrap;
}
.chip.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.part{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* ============================================================ MODULE VIEW */
.mod-head{padding:24px 22px}
.mod-head h2{font-size:24px;margin:8px 0 12px;letter-spacing:-.03em}
.mod-why{font-size:15px;color:var(--ink-2);max-width:64ch}
.mod-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed var(--rule)}
.mod-stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:block}
.mod-stat .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}

.section-note{font-size:13.5px;color:var(--ink-2);padding:14px 22px 0;max-width:66ch}

/* concept table */
.concepts{list-style:none;margin:0;padding:0}
.concepts li{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  padding:11px 22px;border-top:1px solid var(--rule);
}
.concepts li:first-child{border-top:0}
.concept-t{font-size:14px;line-height:1.45}
.levels{display:flex;gap:2px;background:var(--sunken);padding:2px;border-radius:var(--r);border:1px solid var(--rule)}
.levels button{
  border:0;background:transparent;border-radius:2px;padding:4px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;
}
.levels button:hover{color:var(--ink)}
.levels button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .levels button[aria-pressed="true"]{color:#0B1421}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .levels button[aria-pressed="true"]{color:#0B1421}
}

/* skip list */
.skip{padding:16px 22px;background:var(--sunken);border-top:1px solid var(--rule)}
.skip .eyebrow{color:var(--ink-3);display:block;margin-bottom:8px}
.skip ul{margin:0;padding-left:18px;color:var(--ink-3);font-size:13.5px}
.skip li{margin:3px 0}

/* resources */
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:11px 22px;border-top:1px solid var(--rule);align-items:baseline}
.res li:first-child{border-top:0}
.res-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.res-n{font-size:14px}
.res-note{font-size:12.5px;color:var(--ink-3);display:block;margin-top:1px}
.star{color:var(--signal);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}

/* build */
.build{padding:18px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.build p{font-size:14.5px;line-height:1.55}
.check-box{
  appearance:none;width:22px;height:22px;border:1.5px solid var(--rule-strong);border-radius:var(--r);
  background:var(--panel);display:grid;place-items:center;margin:2px 0 0;flex:none;cursor:pointer;
}
.check-box:checked{background:var(--good);border-color:var(--good)}
.check-box:checked::after{content:"";width:5px;height:10px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(42deg) translate(-1px,-1px)}
.done-flag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);margin-top:8px;display:inline-block}

/* checkpoint */
.q{padding:18px 22px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q-t{font-size:14.5px;line-height:1.5;margin-bottom:4px}
.q-n{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.rubric{margin:10px 0 12px;padding:10px 14px;background:var(--sunken);border-radius:var(--r);border:1px solid var(--rule)}
.rubric .eyebrow{display:block;margin-bottom:5px}
.rubric ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink-2)}
.rubric li{margin:2px 0}
textarea{
  width:100%;min-height:104px;resize:vertical;font:inherit;font-size:14px;
  background:var(--sunken);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r);
  padding:11px 13px;line-height:1.55;
}
textarea::placeholder{color:var(--ink-3)}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{
  background:var(--panel);border:1px solid var(--rule-strong);border-radius:var(--r);
  padding:6px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B1421}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1421}}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.verdicts{display:flex;gap:2px;background:var(--sunken);padding:2px;border-radius:var(--r);border:1px solid var(--rule);margin-left:auto}
.verdicts button{
  border:0;background:transparent;border-radius:2px;padding:5px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
}
.verdicts button[data-v="pass"][aria-pressed="true"]{background:var(--good);color:var(--panel)}
.verdicts button[data-v="partial"][aria-pressed="true"]{background:var(--warn);color:var(--panel)}
.verdicts button[data-v="retry"][aria-pressed="true"]{background:var(--signal);color:var(--panel)}

.mod-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--panel);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  padding:9px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============================================================ RESPONSIVE */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .spine{display:flex;overflow-x:auto;padding:14px 16px;gap:2px}
  .spine li:not(:last-child) .spine-link::after{display:none}
  .spine-link{grid-template-columns:auto;gap:8px;min-width:170px;padding:10px 12px;border-radius:var(--r)}
  .spine-link[aria-current="page"]::before{display:none}
  .main{padding:20px 16px 70px}
  .hero{grid-template-columns:1fr}
  .hero-figure{text-align:left}
  .row{grid-template-columns:30px minmax(0,1fr) 56px;gap:10px}
  .row .meter-wrap{display:none}
  .concepts li{grid-template-columns:1fr}
  .levels{overflow-x:auto}
}
</style>

    {t:"docs", n:"OWASP Top 10 for LLM Applications", u:"https://owasp.org/www-project-top-10-for-large-language-model-applications/"},
    {t:"blog", n:"Simon Willison — prompt injection archive", u:"https://simonwillison.net/tags/prompt-injection/"},
    {t:"docs", n:"NIST AI Risk Management Framework", u:"https://www.nist.gov/itl/ai-risk-management-framework", note:"Skim for vocabulary your risk team already uses."}
  ],
  checks:[
    {q:"Your agent reads incoming customer emails and can draft replies and update the CRM. Where is the injection surface, and what's your architecture?",
     rubric:["The email body is fully attacker-controlled input entering the context","Attack: instructions in an email causing CRM writes, data exfiltration, or malicious replies","Defences: no auto-send, human approval before any write; strictly scoped CRM tool (specific fields, specific records); no general egress tool","Treat all email content as data — structural separation, not a prompt-level plea","Monitoring for anomalous tool-call patterns"]},
    {q:"Define the success metric for your chosen process — one that would let you honestly conclude the project failed.",
     rubric:["A specific, measurable, pre-registered number tied to the process outcome","A baseline measured BEFORE the agent existed","A failure threshold stated in advance","Counter-metrics: error rate, rework, review time, user trust — not just throughput","Avoids unfalsifiable claims like 'saves time' with no measurement"]},
    {q:"What's the cheapest experiment that would tell you this whole idea is a bad one?",
     rubric:["Names a concrete, days-not-months test — manual 'Wizard of Oz' run, or a prompt over 20 real historical cases","Identifies the riskiest assumption and targets that specifically","Explicit kill criteria agreed before starting","Shows the instinct to disprove early rather than build first"]}
  ]
}
];

/* Capstone shown on the dashboard once things are underway. */
const CAPSTONE = [
  "An internal assistant grounded in your team's real documents, with a measured recall@5 and a published eval pass rate.",
  "An MCP server for a system your colleagues use daily, plus a short written threat model.",
  "One real work process running end to end with a human approval gate and a week of measured before/after data."
];

/* ============================================================================
   STATE
   ============================================================================ */
const LS_KEY = "edward-ai-roadmap-v1";
const LEVELS = ["—","Learning","Can explain","Can teach"];
const LEVEL_WEIGHT = [0, .35, .85, 1];
const VERDICT_WEIGHT = {"":0, retry:0, partial:.5, pass:1};
const W_CONCEPTS = .35, W_BUILD = .40, W_CHECK = .25;

let state = load();

function blank(){ return {v:1, m:{}}; }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    return (p && p.m) ? p : blank();
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("Could not save — storage blocked"); }
}
function ms(id){
  if(!state.m[id]) state.m[id] = {c:{}, build:false, checks:{}, answers:{}};
  const s = state.m[id];
  s.c = s.c || {}; s.checks = s.checks || {}; s.answers = s.answers || {};
  return s;
}

/* ---- progress maths --------------------------------------------------- */
function conceptScore(mod){
  const s = ms(mod.id), n = mod.concepts.length;
  if(!n) return 0;
  let t = 0;
  for(let i=0;i<n;i++) t += LEVEL_WEIGHT[s.c[i] || 0];
  return t/n;
}
function checkScore(mod){
  const s = ms(mod.id), n = mod.checks.length;
  if(!n) return 0;
  let t = 0;
  for(let i=0;i<n;i++) t += VERDICT_WEIGHT[s.checks[i] || ""];
  return t/n;
}
function modProgress(mod){
  return conceptScore(mod)*W_CONCEPTS + (ms(mod.id).build?1:0)*W_BUILD + checkScore(mod)*W_CHECK;
}
function overall(){
  let num = 0, den = 0;
  for(const m of ROADMAP){ num += modProgress(m)*m.hours; den += m.hours; }
  return den ? num/den : 0;
}
function pct(x){ return Math.round(x*100); }
function isDone(mod){ return modProgress(mod) >= .999; }

/* The recommended next action: earliest incomplete module, earliest gap in it. */
function nextAction(){
  for(const mod of ROADMAP){
    if(isDone(mod)) continue;
    const s = ms(mod.id);
    const gaps = [];
    const weak = mod.concepts.findIndex((_,i)=> (s.c[i]||0) < 2);
    if(weak > -1) gaps.push({kind:"concept", text:`Work through “${mod.concepts[weak]}” until you can explain it without notes.`});
    if(!s.build) gaps.push({kind:"build", text:mod.build});
    const q = mod.checks.findIndex((_,i)=> (s.checks[i]||"") !== "pass");
    if(q > -1) gaps.push({kind:"check", text:`Answer checkpoint ${q+1} and have it graded: “${mod.checks[q].q}”`});
    if(gaps.length) return {mod, ...gaps[0]};
  }
  return null;
}

/* ============================================================================
   RENDER
   ============================================================================ */
const main = document.getElementById("main");
const spine = document.getElementById("spine");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderSpine(){
  const route = location.hash.replace(/^#/,"") || "/";
  const nextMod = (nextAction()||{}).mod;
  spine.innerHTML = ROADMAP.map(mod=>{
    const p = modProgress(mod);
    const cur = route === `/m/${mod.id}`;
    const cls = ["node", isDone(mod)?"is-done":"", (nextMod && nextMod.id===mod.id && !isDone(mod))?"is-next":""].filter(Boolean).join(" ");
    return `<li><a class="spine-link" href="#/m/${mod.id}" ${cur?'aria-current="page"':""}>
      <span class="${cls}" style="--p:${p.toFixed(3)}"></span>
      <span class="spine-t">
        <span class="spine-top">
          <span class="spine-code">${mod.id} · ${esc(mod.tier)}</span>
          <span class="spine-pct">${pct(p)}%</span>
        </span>
        <span class="spine-name">${esc(mod.title)}</span>
      </span></a></li>`;
  }).join("");
  document.getElementById("dashLink").setAttribute("aria-current", route === "/" ? "page" : "false");
  document.getElementById("dashLink").querySelector(".node").style.setProperty("--p", overall().toFixed(3));
}

function meter(p){ return `<div class="meter"><span style="width:${(p*100).toFixed(1)}%"></span></div>`; }

/* ---- dashboard -------------------------------------------------------- */
function viewDashboard(){
  const o = overall();
  const done = ROADMAP.filter(isDone).length;
  const builds = ROADMAP.filter(m=>ms(m.id).build).length;
  const totalConcepts = ROADMAP.reduce((a,m)=>a+m.concepts.length,0);
  const explained = ROADMAP.reduce((a,m)=>{ const s=ms(m.id); return a + m.concepts.filter((_,i)=>(s.c[i]||0)>=2).length; },0);
  const passed = ROADMAP.reduce((a,m)=>{ const s=ms(m.id); return a + m.checks.filter((_,i)=>(s.checks[i]||"")==="pass").length; },0);
  const totalChecks = ROADMAP.reduce((a,m)=>a+m.checks.length,0);
  const hoursLeft = Math.round(ROADMAP.reduce((a,m)=>a + m.hours*(1-modProgress(m)), 0));
  const na = nextAction();

  const started = o > 0;

  return `<div class="view stack">
    <section class="card">
      <div class="hero">
        <div>
          <span class="eyebrow">Overall progress</span>
          <h2>${started ? "Where you are" : "Start at 00 and go in order"}</h2>
          <p>${started
            ? `Weighted by estimated effort, not by module count. Roughly <strong class="num">${hoursLeft}</strong> focused hours of the plan remain.`
            : `Eleven modules, about <strong class="num">130</strong> focused hours. The order is deliberate — modules 02 and 04 are the ones that make everything after them cheaper. You can jump anywhere, but skipping those two costs you later.`}</p>
        </div>
        <div class="hero-figure">
          <span class="hero-num">${pct(o)}<sup>%</sup></span>
        </div>
      </div>
      <div style="padding:0 22px 22px">${meter(o)}</div>
    </section>

    ${na ? `<section class="card next card-pad">
      <span class="eyebrow">You are here → next action</span>
      <h3>${esc(na.mod.id)} · ${esc(na.mod.title)}</h3>
      <p>${esc(na.text)}</p>
      <p style="margin-top:14px"><a href="#/m/${na.mod.id}">Open module ${na.mod.id} →</a></p>
    </section>` : `<section class="card next card-pad">
      <span class="eyebrow">Roadmap complete</span>
      <h3>Every module closed out</h3>
      <p>Re-run your evals from Module 02 against the current generation of models, and replace any module whose content has aged. Then pick a harder process.</p>
    </section>`}

    <section class="card">
      <div class="card-h"><h3>Signals</h3><span class="eyebrow">Builds are the ones that count</span></div>
      <div class="tiles">
        <div class="tile"><span class="v">${done}<span style="color:var(--ink-3);font-size:.6em">/${ROADMAP.length}</span></span><span class="k">Modules closed</span></div>
        <div class="tile"><span class="v">${builds}<span style="color:var(--ink-3);font-size:.6em">/${ROADMAP.length}</span></span><span class="k">Builds shipped</span></div>
        <div class="tile"><span class="v">${explained}<span style="color:var(--ink-3);font-size:.6em">/${totalConcepts}</span></span><span class="k">Concepts explainable</span></div>
        <div class="tile"><span class="v">${passed}<span style="color:var(--ink-3);font-size:.6em">/${totalChecks}</span></span><span class="k">Checkpoints passed</span></div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Modules</h3><span class="eyebrow">Click any — nothing is locked</span></div>
      <div class="rows">
        ${ROADMAP.map(mod=>{
          const p = modProgress(mod), s = ms(mod.id);
          const cGood = mod.concepts.filter((_,i)=>(s.c[i]||0)>=2).length;
          const cPass = mod.checks.filter((_,i)=>(s.checks[i]||"")==="pass").length;
          return `<a class="row" href="#/m/${mod.id}">
            <span class="row-code">${mod.id}</span>
            <span>
              <span class="row-name">${esc(mod.title)}${mod.keystone?' <span class="star">keystone</span>':""}</span>
              <span class="row-meta">${esc(mod.tier)} · ~${mod.hours}h · concepts ${cGood}/${mod.concepts.length} · build ${s.build?"done":"open"} · checks ${cPass}/${mod.checks.length}</span>
            </span>
            <span class="meter-wrap">${meter(p)}</span>
            <span class="row-pct">${pct(p)}%</span>
          </a>`;
        }).join("")}
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Proof of expertise</h3><span class="eyebrow">What you show people</span></div>
      <div class="card-pad">
        <p style="color:var(--ink-2);font-size:14px;margin-bottom:12px;max-width:64ch">Nobody can inspect your percentage. These three artefacts are what actually demonstrate applied capability — every build task in the roadmap feeds one of them.</p>
        <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.65;color:var(--ink-2)">
          ${CAPSTONE.map(c=>`<li style="margin:6px 0">${esc(c)}</li>`).join("")}
        </ul>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>How to use this</h3></div>
      <div class="card-pad" style="font-size:14px;color:var(--ink-2);line-height:1.65;max-width:66ch">
        <p style="margin-bottom:10px"><strong style="color:var(--ink)">Rate concepts honestly.</strong> “Can explain” means you could explain it to a sceptical colleague with no notes and survive one follow-up question. Anything less is “Learning”.</p>
        <p style="margin-bottom:10px"><strong style="color:var(--ink)">The build is the module.</strong> It's weighted at ${Math.round(W_BUILD*100)}% for a reason. Reading about tool calling and writing an agent loop are different skills.</p>
        <p style="margin-bottom:10px"><strong style="color:var(--ink)">Grade the checkpoints with an LLM.</strong> Write your answer, hit “Copy grading prompt”, paste it into Claude or Copilot, and record the verdict it gives you. It ships the rubric with your answer and is instructed to be strict.</p>
        <p><strong style="color:var(--ink)">Your progress lives in this browser only.</strong> Use Export in the sidebar before you change machine or clear site data. Links drift — if a resource 404s, search its title.</p>
      </div>
    </section>
  </div>`;
}

/* ---- module ----------------------------------------------------------- */
function viewModule(id){
  const idx = ROADMAP.findIndex(m=>m.id===id);
  if(idx < 0) return `<div class="view card card-pad"><h2>Unknown module</h2><p style="margin-top:8px"><a href="#/">Back to dashboard</a></p></div>`;
  const mod = ROADMAP[idx], s = ms(id), p = modProgress(mod);
  const prev = ROADMAP[idx-1], next = ROADMAP[idx+1];

  return `<div class="view stack">
    <section class="card">
      <div class="mod-head">
        <span class="eyebrow">Module ${mod.id} · ${esc(mod.tier)}${mod.keystone?" · Keystone":""}</span>
        <h2>${esc(mod.title)}</h2>
        <p class="mod-why">${esc(mod.why)}</p>
        <div class="mod-stats">
          <span class="mod-stat"><span class="k">Progress</span><span class="v">${pct(p)}%</span></span>
          <span class="mod-stat"><span class="k">Est. effort</span><span class="v">~${mod.hours}h</span></span>
          <span class="mod-stat"><span class="k">Concepts</span><span class="v">${mod.concepts.filter((_,i)=>(s.c[i]||0)>=2).length}/${mod.concepts.length}</span></span>
          <span class="mod-stat"><span class="k">Build</span><span class="v">${s.build?"Shipped":"Open"}</span></span>
          <span class="mod-stat"><span class="k">Checkpoints</span><span class="v">${mod.checks.filter((_,i)=>(s.checks[i]||"")==="pass").length}/${mod.checks.length}</span></span>
        </div>
        <div style="margin-top:16px">${meter(p)}</div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>The 20% that carries the 80%</h3><span class="eyebrow">Rate yourself honestly</span></div>
      <ul class="concepts">
        ${mod.concepts.map((c,i)=>`<li>
          <span class="concept-t">${esc(c)}</span>
          <span class="levels" role="group" aria-label="Level for: ${esc(c)}">
            ${LEVELS.map((l,lv)=>`<button data-act="level" data-m="${id}" data-i="${i}" data-lv="${lv}"
              aria-pressed="${lv > 0 && (s.c[i]||0) === lv}" title="${lv?esc(l):"Clear"}">${esc(l)}</button>`).join("")}
          </span>
        </li>`).join("")}
      </ul>
      <div class="skip">
        <span class="eyebrow">Deliberately skipping — the 80% that isn't worth your hours yet</span>
        <ul>${mod.skip.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Build — ${Math.round(W_BUILD*100)}% of this module</h3><span class="eyebrow">The part that can't be faked</span></div>
      <div class="build">
        <input type="checkbox" class="check-box" data-act="build" data-m="${id}" ${s.build?"checked":""} aria-label="Mark build as shipped">
        <div>
          <p>${esc(mod.build)}</p>
          ${s.build?'<span class="done-flag">✓ Shipped</span>':""}
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Sources</h3><span class="eyebrow">Read the starred one first</span></div>
      <ul class="res">
        ${mod.resources.map(r=>`<li>
          <span class="res-type">${esc(r.t)}</span>
          <span>
            <span class="res-n">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.n)}</a>`:esc(r.n)}${r.star?'<span class="star">start here</span>':""}</span>
            ${r.note?`<span class="res-note">${esc(r.note)}</span>`:""}
          </span>
        </li>`).join("")}
      </ul>
    </section>

    <section class="card">
      <div class="card-h"><h3>Checkpoint</h3><span class="eyebrow">Answer cold, then have it graded</span></div>
      <p class="section-note">Write the answer without looking anything up — that's the whole point. Then copy the grading prompt into Claude or Copilot and record the verdict it gives you, not the one you'd like.</p>
      ${mod.checks.map((c,i)=>{
        const v = s.checks[i] || "";
        return `<div class="q">
          <span class="q-n">Q${i+1}</span>
          <p class="q-t">${esc(c.q)}</p>
          <div class="rubric">
            <span class="eyebrow">A strong answer contains</span>
            <ul>${c.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
          </div>
          <textarea data-act="answer" data-m="${id}" data-i="${i}" placeholder="Your answer, from memory…">${esc(s.answers[i]||"")}</textarea>
          <div class="q-actions">
            <button class="btn primary" data-act="grade" data-m="${id}" data-i="${i}">Copy grading prompt</button>
            <span class="verdicts" role="group" aria-label="Verdict for question ${i+1}">
              ${["retry","partial","pass"].map(x=>`<button data-act="verdict" data-m="${id}" data-i="${i}" data-v="${x}" aria-pressed="${v===x}">${x}</button>`).join("")}
            </span>
          </div>
        </div>`;
      }).join("")}
    </section>

    <nav class="mod-nav">
      ${prev?`<a class="btn" href="#/m/${prev.id}" style="text-decoration:none">← ${esc(prev.id)}</a>`:"<span></span>"}
      <button class="btn" data-act="reset" data-m="${id}">Reset this module</button>
      ${next?`<a class="btn" href="#/m/${next.id}" style="text-decoration:none">${esc(next.id)} →</a>`:"<span></span>"}
    </nav>
  </div>`;
}

/* ---- router ----------------------------------------------------------- */
function render(){
  const route = location.hash.replace(/^#/,"") || "/";
  const m = route.match(/^\/m\/(.+)$/);
  main.innerHTML = m ? viewModule(m[1]) : viewDashboard();
  renderSpine();
  window.scrollTo({top:0, behavior:"instant"});
}
window.addEventListener("hashchange", render);

/* ============================================================================
   INTERACTION
   ============================================================================ */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function gradingPrompt(mod, i){
  const c = mod.checks[i], a = (ms(mod.id).answers[i]||"").trim();
  return `You are grading my understanding, strictly. Do not be encouraging.

TOPIC: ${mod.title} (module ${mod.id} of an applied AI engineering roadmap)

QUESTION
${c.q}

WHAT A STRONG ANSWER MUST CONTAIN
${c.rubric.map(r=>`- ${r}`).join("\n")}

MY ANSWER
${a || "(no answer written yet)"}

Grade it PASS, PARTIAL or RETRY against the rubric above.
PASS means I could defend this to an experienced practitioner.
Then, in order:
1. List each rubric point I missed or got wrong, quoting my words.
2. Name any factual error, however small.
3. State the single most important thing I should go and re-learn, and how.
Be concise and blunt. If the answer is vague or hand-wavy, that is a RETRY even if nothing is technically wrong.`;
}

async function copy(text){
  try{
    await navigator.clipboard.writeText(text);
    toast("Grading prompt copied — paste it into Claude");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Grading prompt copied"); }
    catch(_){ toast("Copy failed — select the text manually"); }
    document.body.removeChild(ta);
  }
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.m, i = +el.dataset.i;

  if(act === "level"){
    const s = ms(id);
    const lv = +el.dataset.lv;
    s.c[i] = (s.c[i]||0) === lv ? 0 : lv;
    save(); render();
  }
  if(act === "verdict"){
    const s = ms(id);
    s.checks[i] = s.checks[i] === el.dataset.v ? "" : el.dataset.v;
    save(); render();
  }
  if(act === "grade"){
    const mod = ROADMAP.find(m=>m.id===id);
    copy(gradingPrompt(mod, i));
  }
  if(act === "reset"){
    if(confirm("Clear all progress, answers and verdicts for this module?")){
      delete state.m[id]; save(); render(); toast("Module reset");
    }
  }
});

document.addEventListener("change", e=>{
  const el = e.target.closest("[data-act='build']");
  if(!el) return;
  ms(el.dataset.m).build = el.checked;
  save(); render();
});

/* Autosave answers without re-rendering (which would eat the caret). */
document.addEventListener("input", e=>{
  const el = e.target.closest("textarea[data-act='answer']");
  if(!el) return;
  ms(el.dataset.m).answers[+el.dataset.i] = el.value;
  clearTimeout(document._save);
  document._save = setTimeout(save, 400);
});

/* ---- theme ------------------------------------------------------------ */
const savedTheme = localStorage.getItem(LS_KEY+":theme");
if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", now);
  localStorage.setItem(LS_KEY+":theme", now);
});

/* ---- export / import -------------------------------------------------- */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ai-roadmap-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Progress exported");
});
document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!p || typeof p !== "object" || !p.m) throw new Error("shape");
      state = p; save(); render(); toast("Progress imported");
    }catch(err){ toast("That file isn't a progress export"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

render();
</script>
